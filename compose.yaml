# Local development. Run python scripts/init_local.py before starting Compose.
name: ci-ayan-kassen-6280

services:
  app:
    build: .
    image: ci-ayan-kassen-6280-club-events:dev
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_NAME: ${APP_NAME}
      APP_OWNER: ${APP_OWNER}
      APP_VERSION: ${APP_VERSION:-dev}
      SECRET_KEY: ${SECRET_KEY:?run scripts/init_local.py}
      DB_URL: ${DB_URL}
      DB_PASSWORD: ${DB_PASSWORD:?run scripts/init_local.py}
      STORAGE_BACKEND: ${STORAGE_BACKEND}
      BUCKET: ${BUCKET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH}
      PASSWORD_REQUIRE_SYMBOL: ${PASSWORD_REQUIRE_SYMBOL}
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: club_events
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init_local.py}
      APP_DB_PASSWORD: ${DB_PASSWORD:?run scripts/init_local.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/postgres/init.sql:/docker-entrypoint-initdb.d/10-app.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "club_events"]
      interval: 5s
      retries: 10

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/local/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init_local.py}
    volumes:
      - ./deploy/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  uploads:
  pgdata:
